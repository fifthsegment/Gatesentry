services:
  gatesentry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gatesentry
    restart: unless-stopped

    network_mode: host

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10786/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    volumes:
      - ./docker_root:/usr/local/gatesentry/gatesentry
      # Optional, disabled by default: expose host tailscaled's runtime socket read-only.
      # Host networking alone does not expose host filesystem sockets. Never mount /var/lib/tailscale.
      # - /var/run/tailscale:/var/run/tailscale:ro
      # Optional first run only: a chmod 600 JSON file with {"username","password"}
      # - ./secrets/gatesentry-bootstrap.json:/run/secrets/gatesentry-bootstrap.json:ro

    environment:
      # Optional explicit socket override; the mounted default above is auto-detected.
      # - GATESENTRY_TAILSCALE_SOCKET=/var/run/tailscale/tailscaled.sock
      - TZ=Asia/Singapore
      # Set only while the read-only bootstrap file is mounted, then remove it.
      # - GATESENTRY_BOOTSTRAP_FILE=/run/secrets/gatesentry-bootstrap.json
