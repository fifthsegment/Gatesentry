services:
  gatesentry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gatesentry
    restart: unless-stopped

    network_mode: host

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10786/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    volumes:
      - ./docker_root:/usr/local/gatesentry/gatesentry
      # Optional first run only: chmod 600 ./secrets/gatesentry-bootstrap.json
      # - ./secrets/gatesentry-bootstrap.json:/run/secrets/gatesentry-bootstrap.json:ro

    environment:
      - TZ=Asia/Singapore
      # Set only while the read-only bootstrap file is mounted, then remove it.
      # - GATESENTRY_BOOTSTRAP_FILE=/run/secrets/gatesentry-bootstrap.json
