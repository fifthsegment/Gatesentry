# GateSentry quickstart using the published image (linux/amd64 and linux/arm64).
# Copy this single file to any directory on a Linux Docker host, then run:
#   mkdir -p gatesentry-data
#   docker compose -f docker-compose.prebuilt.yml up -d
#
# Pin the image before relying on this in production, and read the security
# note about the currently published image in docs/docker.md first:
#   image: abdullahi1/gatesentry:latest@sha256:<digest>
services:
  gatesentry:
    image: abdullahi1/gatesentry:latest
    container_name: gatesentry
    restart: unless-stopped

    network_mode: host

    healthcheck:
      # The dashboard URL keeps this probe valid for images published before
      # the /health endpoint existed. Once every image you pin includes it,
      # switch the URL below to http://127.0.0.1:10786/health.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10786/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    volumes:
      - ./gatesentry-data:/usr/local/gatesentry/gatesentry
      # Optional first run only: chmod 600 gatesentry-bootstrap.json
      # - ./gatesentry-bootstrap.json:/run/secrets/gatesentry-bootstrap.json:ro

    environment:
      - TZ=Etc/UTC
      # Set only while the read-only bootstrap file is mounted, then remove it.
      # - GATESENTRY_BOOTSTRAP_FILE=/run/secrets/gatesentry-bootstrap.json
