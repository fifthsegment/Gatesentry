image: golang:1.24.10-bookworm

pipelines:
  default:
    - step:
        name: Verify and build exact revision
        caches:
          - node
        script:
          - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl && rm -rf /var/lib/apt/lists/*
          - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          - apt-get update && apt-get install -y --no-install-recommends nodejs && rm -rf /var/lib/apt/lists/*
          - corepack enable && corepack prepare yarn@4.10.3 --activate
          - make release-artifacts
          - test "$(cat dist/REVISION)" = "$(git rev-parse HEAD)"
        artifacts:
          - dist/**
