name: Verify PR

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  docker-quickstart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose installation files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prebuilt.yml config --quiet
      - name: Build and smoke test the Docker installation path
        run: make docker-smoke REVISION="$(git rev-parse --short HEAD)" IMAGE=gatesentry:pr-verify

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.10
          cache-dependency-path: |
            go.sum
            application/go.sum
            gatesentryproxy/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: yarn-cache
        name: Enable Yarn 4.10.3
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          echo "dir=$(cd ui && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('ui/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Verify source and build
        run: make verify
      - name: Proxy smoke (binary + curl)
        run: make proxy-smoke
      - name: Build revision artifacts
        run: make release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: gatesentry-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
