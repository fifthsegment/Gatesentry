name: Build and release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      revision:
        description: Existing full commit SHA to build; defaults to the current branch revision
        required: false
        type: string
      tag:
        description: Existing tag at the selected revision to publish; leave empty for a dry build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
      tag: ${{ steps.revision.outputs.tag }}
      publish: ${{ steps.revision.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: revision
        name: Verify requested revision and publication tag
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          revision=$(git rev-parse HEAD)
          if [[ -n "$REQUESTED_REVISION" ]]; then
            [[ "$REQUESTED_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]
            test "$(git rev-parse "$REQUESTED_REVISION^{commit}")" = "$revision"
          fi
          tag="$REQUESTED_TAG"
          if [[ -n "$EVENT_TAG" ]]; then
            test -z "$tag" || test "$tag" = "$EVENT_TAG"
            tag="$EVENT_TAG"
          fi
          publish=false
          if [[ -n "$tag" ]]; then
            git check-ref-format "refs/tags/$tag"
            git show-ref --verify --quiet "refs/tags/$tag"
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$revision"
            publish=true
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.10
          cache-dependency-path: |
            go.sum
            application/go.sum
            gatesentryproxy/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: ui/yarn.lock
      - run: corepack enable && corepack prepare yarn@4.10.3 --activate
      - run: make release-artifacts
      - name: Verify artifact revision and checksums
        run: |
          test "$(cat dist/REVISION)" = "${{ steps.revision.outputs.revision }}"
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: gatesentry-${{ steps.revision.outputs.revision }}
          path: dist/
          if-no-files-found: error

  docker-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - name: Ensure checked-out artifact revision
        run: test "$(git rev-parse HEAD)" = "${{ needs.build.outputs.revision }}"
      - run: make docker-smoke REVISION=${{ needs.build.outputs.revision }} IMAGE=gatesentry:${{ needs.build.outputs.revision }}

  publish:
    if: needs.build.outputs.publish == 'true'
    needs: [build, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: gatesentry-${{ needs.build.outputs.revision }}
          path: dist
      - name: Verify downloaded artifact revision and checksums
        run: |
          test "$(cat dist/REVISION)" = "${{ needs.build.outputs.revision }}"
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
