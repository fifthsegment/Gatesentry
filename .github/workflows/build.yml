name: Build and release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag at the checked-out revision to publish; leave empty for a dry build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
      tag: ${{ steps.revision.outputs.tag }}
      publish: ${{ steps.revision.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: revision
        name: Verify publication revision
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          revision=$(git rev-parse HEAD)
          tag="$INPUT_TAG"
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          publish=false
          if [[ -n "$tag" ]]; then
            git show-ref --verify --quiet "refs/tags/$tag"
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$revision"
            publish=true
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: yarn
          cache-dependency-path: ui/yarn.lock
      - run: corepack enable && corepack prepare yarn@4.10.3 --activate
      - run: make release-artifacts
      - name: Verify artifact revision
        run: test "$(cat dist/REVISION)" = "${{ steps.revision.outputs.revision }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gatesentry-${{ steps.revision.outputs.revision }}
          path: dist/
          if-no-files-found: error
  docker-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure checked-out triggering revision
        run: test "$(git rev-parse HEAD)" = "${{ needs.build.outputs.revision }}"
      - run: make docker-smoke REVISION=${{ needs.build.outputs.revision }} IMAGE=gatesentry:${{ needs.build.outputs.revision }}

  publish:
    if: needs.build.outputs.publish == 'true'
    needs: [build, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: gatesentry-${{ needs.build.outputs.revision }}
          path: dist
      - name: Verify downloaded artifact revision
        run: test "$(cat dist/REVISION)" = "${{ needs.build.outputs.revision }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: dist/gatesentry-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
