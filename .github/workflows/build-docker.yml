name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
  # Called by "Build and release" after it publishes a release, because a
  # release created with GITHUB_TOKEN does not trigger other workflows.
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: revision
        name: Verify requested tag and revision
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          git check-ref-format "refs/tags/$REQUESTED_TAG"
          [[ "$REQUESTED_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          revision=$(git rev-parse HEAD)
          git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG"
          test "$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")" = "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.10
          cache-dependency-path: |
            go.sum
            application/go.sum
            gatesentryproxy/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: yarn-cache
        name: Enable Yarn 4.10.3
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          echo "dir=$(cd ui && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('ui/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Verify exact source
        run: make verify
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: gatesentry:${{ inputs.tag }}
          build-args: VCS_REF=${{ steps.revision.outputs.revision }}
      - name: Smoke exact image
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: IMAGE="gatesentry:$REQUESTED_TAG" ./scripts/docker-smoke.sh
      - name: Publish verified multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            abdullahi1/gatesentry:${{ inputs.tag }}
            abdullahi1/gatesentry:latest
          build-args: VCS_REF=${{ steps.revision.outputs.revision }}
