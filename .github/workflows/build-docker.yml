name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: revision
        name: Verify requested tag and revision
        run: |
          revision=$(git rev-parse HEAD)
          test "$(git rev-parse "refs/tags/${{ inputs.tag }}^{commit}")" = "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gatesentry:${{ inputs.tag }}
          build-args: VCS_REF=${{ steps.revision.outputs.revision }}
      - name: Smoke exact image
        run: IMAGE=gatesentry:${{ inputs.tag }} ./scripts/docker-smoke.sh
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            abdullahi1/gatesentry:${{ inputs.tag }}
            abdullahi1/gatesentry:latest
          build-args: VCS_REF=${{ steps.revision.outputs.revision }}
