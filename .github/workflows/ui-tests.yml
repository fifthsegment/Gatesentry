name: UI Tests

on:
  push:
    branches: [master]
    paths: ["ui/**", "scripts/frontend.sh", "Makefile"]
  pull_request:
    branches: [master]
    paths: ["ui/**", "scripts/frontend.sh", "Makefile"]

permissions:
  contents: read

jobs:
  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.10
          cache-dependency-path: |
            go.sum
            application/go.sum
            gatesentryproxy/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: yarn-cache
        name: Enable Yarn 4.10.3
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          echo "dir=$(cd ui && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('ui/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: make ui-check frontend-assets
