name: Go Test and Coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: yarn-cache
        name: Enable Yarn 4.10.3
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          echo "dir=$(cd ui && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('ui/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Verify reproducible build path
        run: make verify
      - name: Proxy smoke (binary + curl)
        run: make proxy-smoke
      - name: Collect coverage
        run: make coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: true

  proxy-smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.10
          cache-dependency-path: |
            go.sum
            application/go.sum
            gatesentryproxy/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Proxy smoke (Windows binary + curl)
        shell: bash
        env:
          GS_SMOKE_BIN: ${{ runner.temp }}/gatesentry-proxy-smoke.exe
          GS_SMOKE_BOOTSTRAP: ${{ runner.temp }}/gs-smoke-bootstrap
          GS_SMOKE_CA: ${{ runner.temp }}/gs-smoke-ca.pem
          GS_SMOKE_PID: ${{ runner.temp }}/gs-smoke.pid
          GS_SMOKE_LOG: ${{ runner.temp }}/gs-smoke.log
          GS_SMOKE_PYTHON: python
          GOTOOLCHAIN: go1.24.10
        run: bash scripts/proxy-smoke.sh
